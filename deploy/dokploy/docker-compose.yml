services:
  panel:
    image: ${PANEL_IMAGE:-ghcr.io/mrcook1e-ai/amneziawg-panel:latest}
    pull_policy: always
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun

    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

    expose:
      - "51821"

    ports:
      - "${WG_PORT_RANGE_START:-51820}-${WG_PORT_RANGE_END:-51859}:${WG_PORT_RANGE_START:-51820}-${WG_PORT_RANGE_END:-51859}/udp"

    environment:
      WG_HOST: "${WG_HOST}"
      PASSWORD: "${PASSWORD}"
      WG_PORT_RANGE_START: "${WG_PORT_RANGE_START:-51820}"
      WG_PORT_RANGE_END: "${WG_PORT_RANGE_END:-51859}"
      WG_INTERFACE: "${WG_INTERFACE:-awg0}"
      WG_PATH: "${WG_PATH:-/etc/amnezia/amneziawg}"
      WG_DEFAULT_ADDRESS: "${WG_DEFAULT_ADDRESS:-10.8.0.x}"
      WG_DEFAULT_DNS: "${WG_DEFAULT_DNS:-1.1.1.1}"
      WG_ALLOWED_IPS: "${WG_ALLOWED_IPS:-0.0.0.0/0, ::/0}"
      WG_MTU: "${WG_MTU:-1280}"
      WG_PERSISTENT_KEEPALIVE: "${WG_PERSISTENT_KEEPALIVE:-0}"
      WG_EGRESS_IFACE: "${WG_EGRESS_IFACE:-}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PORT: "${PORT:-51821}"
      WEBUI_HOST: "${WEBUI_HOST:-0.0.0.0}"

    volumes:
      - amnezia-state:/etc/amnezia/amneziawg

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:51821/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - dokploy-network

volumes:
  amnezia-state:

networks:
  dokploy-network:
    external: true
