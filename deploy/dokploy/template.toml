[variables]
wg_host = "${domain}"
panel_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "panel"
port = 51821
host = "${wg_host}"

[config.env]
WG_HOST = "${wg_host}"
PASSWORD = "${panel_password}"
WG_PORT_RANGE_START = "51820"
WG_PORT_RANGE_END = "51859"
WG_INTERFACE = "awg0"
WG_PATH = "/etc/amnezia/amneziawg"
WG_DEFAULT_ADDRESS = "10.8.0.x"
WG_DEFAULT_DNS = "1.1.1.1"
WG_ALLOWED_IPS = "0.0.0.0/0, ::/0"
WG_MTU = "0"
WG_PERSISTENT_KEEPALIVE = "0"
WG_EGRESS_IFACE = ""
LOG_FORMAT = "json"
LOG_LEVEL = "info"
PORT = "51821"
WEBUI_HOST = "0.0.0.0"
